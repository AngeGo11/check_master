name: check-master-v2

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: check-master-v2-php:local
    init: true
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-check_master_v2}
      MYSQL_USER: ${DB_USERNAME:-check_master_v2}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run bash scripts/setup.sh first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run bash scripts/setup.sh first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node:
    image: node:22-bookworm-slim
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html

volumes:
  db_data:
